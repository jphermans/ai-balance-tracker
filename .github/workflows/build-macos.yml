name: Build macOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Apple Silicon (arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build macOS app
        run: flutter build macos --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Package as .app bundle
        run: |
          cd build/macos/Build/Products/Release
          APP=$(ls -d *.app | head -1)
          echo "Packaging: $APP"
          zip -r -y ai-balance-tracker-macos.zip "$APP"

      - uses: actions/upload-artifact@v4
        with:
          name: ai-balance-tracker-macos
          path: build/macos/Build/Products/Release/ai-balance-tracker-macos.zip
          retention-days: 30

  # Release creation moved to .github/workflows/release.yml, which uses
  # the workflow_run event to attach artifacts to the v* tag once the
  # main-branch build finishes. This avoids a duplicate macOS build on
  # tag push (saves ~10-12 min of macos-14 runner time per release).
