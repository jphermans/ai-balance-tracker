name: ai_balance_tracker
description: "AI Provider Balance Tracker — securely monitor credits, usage, and funds across multiple AI providers in a unified dashboard."
publish_to: 'none'
version: 1.7.3+17

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  http: ^1.3.0
  intl: ^0.20.2
  fl_chart: ^0.70.2
  go_router: ^14.8.1
  csv: ^6.0.0
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  shared_preferences: ^2.3.4
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/logos/
    - assets/app_banner.png
