name: ai_balance_tracker
description: "AI Provider Balance Tracker — securely monitor credits, usage, and funds across multiple AI providers in a unified dashboard."
publish_to: 'none'
version: 2.1.4+48

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^10.3.1
  http: ^1.3.0
  intl: ^0.20.2
  fl_chart: ^1.2.0
  go_router: ^17.3.0
  csv: ^8.0.0
  share_plus: ^13.1.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.4
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.4
  supabase_flutter: ^2.8.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/logos/
    - assets/app_banner.png
